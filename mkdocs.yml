# Website configuration. Build locally with:
#   pip install -r website/requirements.txt
#   python website/build_site.py && mkdocs serve
site_name: Modern Software Engineering Handbook
site_url: https://giribabu22.github.io/modern-engineering-handbook/
site_description: A free handbook that explains software engineering from first principles — computers, the internet, databases, distributed systems, scalability, and AI engineering.
site_author: giribabu22
repo_url: https://github.com/giribabu22/modern-engineering-handbook
repo_name: giribabu22/modern-engineering-handbook
edit_uri: ""
copyright: Free to read, share, and learn from.

docs_dir: website/.docs
site_dir: website/.site

theme:
  name: material
  custom_dir: website/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/giribabu22/modern-engineering-handbook
  # Paste the content value of Google Search Console's HTML-tag verification here.
  google_site_verification: ""
  # Paste the content value of Bing Webmaster Tools' meta-tag verification here.
  bing_site_verification: ""

